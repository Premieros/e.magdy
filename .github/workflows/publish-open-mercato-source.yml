name: Publish isolated Open Mercato source branch

on:
  push:
    branches: ['feature/publish-open-mercato-app']
    paths:
      - '.github/workflows/publish-open-mercato-source.yml'
      - 'pilot/open-mercato/**'
  workflow_dispatch:

# This job publishes only generated licensed source to a separate Git ref.
# Never runs db:migrate, never creates another Supabase project, never deploys over Pages.
permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate approved standalone Open Mercato WMS project
        run: |
          set -euo pipefail
          bash pilot/open-mercato/bootstrap.sh "$RUNNER_TEMP/garments-source"
      - name: Validate clean source and project lock
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/garments-source/garments-ops"
          test -s "$source/scripts/garments-target-policy.mjs"
          test -s "$source/THIRD_PARTY_NOTICES/Open-Mercato-MIT.txt"
          test ! -f "$source/.env"
          test ! -d "$source/node_modules"
          if SUPABASE_PROJECT_REF=another-project GARMENTS_DB_SCHEMA=garments_ops              DATABASE_URL='postgresql://garments_ops_login:test@db.yumeijsyiphzdsulsubf.supabase.co:5432/postgres?options=-c%20search_path%3Dgarments_ops'              node "$source/scripts/garments-target-policy.mjs"; then
            echo "CRITICAL: foreign project accepted" >&2
            exit 1
          fi
          for key in auth customers catalog sales wms audit_logs; do
            grep -q "id: '$key'" "$source/src/modules.ts"
          done
      - name: Publish generated source to separate deploy branch
        env:
          HUSKY: '0'
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/garments-source/garments-ops"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin deploy/garments-mercato
          git switch --force-create deploy/garments-mercato origin/deploy/garments-mercato
          mkdir -p open-mercato
          rsync -a --delete --exclude='.env' --exclude='.env.local'             --exclude='node_modules' --exclude='.next'             "$source/" open-mercato/
          test -s open-mercato/scripts/garments-target-policy.mjs
          git add -A -- open-mercato
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated app source changes'
          else
            git commit -m "build: publish Open Mercato WMS pinned licensed standalone app"
            git push origin HEAD:refs/heads/deploy/garments-mercato
          fi
