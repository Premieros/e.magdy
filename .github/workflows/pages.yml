name: Deploy Garments Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: garments-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check app.js
          node --check src/workflow.mjs
          node --check src/analytics.mjs
          node --check src/accounting.mjs
          node --check src/accounting-ui.mjs
          node --check src/access-control.mjs
          node --check src/access-ui.mjs
          node --check src/notifications.mjs
          node --check src/factory-ops.mjs
          node --check src/cloud-backup.mjs
          node --check src/production-planning.mjs
          node --check src/wholesale.mjs
          node --check src/demo-data.mjs
          node --check src/cloud-intake.mjs
      - name: Run production and cloud-backup tests
        run: npm test
      - name: Prepare static site only
        run: |
          mkdir -p site/src
          cp index.html styles.css app.js app-icon.svg site/
          cp src/workflow.mjs src/analytics.mjs src/accounting.mjs src/accounting-ui.mjs src/access-control.mjs src/access-ui.mjs src/notifications.mjs src/factory-ops.mjs src/cloud-backup.mjs src/production-planning.mjs src/wholesale.mjs src/demo-data.mjs src/cloud-intake.mjs site/src/
          touch site/.nojekyll
          test -s site/index.html
          test -s site/app-icon.svg
          grep -q 'family=Cairo' site/index.html
          grep -q 'family=Inter' site/index.html
          grep -q 'PREMIEROS DESIGN LANGUAGE' site/styles.css
          test -s site/src/workflow.mjs
          test -s site/src/analytics.mjs
          test -s site/src/accounting.mjs
          test -s site/src/accounting-ui.mjs
          test -s site/src/access-control.mjs
          test -s site/src/access-ui.mjs
          test -s site/src/notifications.mjs
          test -s site/src/cloud-backup.mjs
          test -s site/src/production-planning.mjs
          test -s site/src/wholesale.mjs
          test -s site/src/demo-data.mjs
          test -s site/src/cloud-intake.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
