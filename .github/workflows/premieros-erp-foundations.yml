name: PremierOS Open Mercato foundation checks

on:
  pull_request:
    paths:
      - 'open-mercato/src/lib/premieros/**'
      - 'open-mercato/src/modules/premier_pos/**'
      - 'open-mercato/src/app/layout.tsx'
      - 'open-mercato/scripts/premieros-route-inventory.mjs'
      - 'open-mercato/tsconfig.premieros-foundations.json'
      - 'open-mercato/tsconfig.premier-pos-order-lifecycle.json'
      - 'open-mercato/tsconfig.premier-pos-native-setup.json'
      - 'open-mercato/package.json'
      - 'open-mercato/yarn.lock'
      - '.github/workflows/premieros-erp-foundations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: open-mercato
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Activate pinned Yarn
        run: corepack enable
      - name: Install exact pinned dependencies
        run: yarn install --immutable
      - name: Validate ERP foundations
        run: yarn jest --config jest.config.cjs --runInBand --runTestsByPath src/lib/premieros/__tests__/capability-and-fixture-safety.test.ts src/lib/premieros/__tests__/organization-profile.test.ts src/lib/premieros/__tests__/capability-access.test.ts src/lib/premieros/__tests__/authorized-organization-profile.test.ts src/lib/premieros/__tests__/quantity-boundaries.test.ts src/lib/premieros/__tests__/settlement-boundaries.test.ts src/lib/premieros/__tests__/receipt-preflight.test.ts src/lib/premieros/__tests__/fulfillment-return-preflight.test.ts src/lib/premieros/__tests__/posting-identity.test.ts src/lib/premieros/__tests__/html-translation-guard.test.ts
      - name: Validate native POS order and payment recovery
        run: yarn jest --config jest.config.cjs --runInBand --runTestsByPath src/modules/premier_pos/lib/__tests__/checkout.test.ts
      - name: Validate native POS API scope and calculations
        run: yarn jest --config jest.config.cjs --runInBand --runTestsByPath src/modules/premier_pos/api/__tests__/routes.test.ts
      - name: Validate POS online-state rendering
        run: yarn jest --config jest.config.cjs --runInBand --runTestsByPath src/modules/premier_pos/lib/__tests__/online-status.test.ts
      - name: Validate canonical order lifecycle read-model
        run: yarn jest --config jest.config.cjs --runInBand --runTestsByPath src/modules/premier_pos/lib/__tests__/order-trace.test.ts
      - name: Validate native setup payloads and scope isolation
        run: yarn jest --config jest.config.cjs --runInBand --runTestsByPath src/modules/premier_pos/lib/__tests__/native-setup.test.ts
      - name: Verify native catalog sample pricing and offer contracts
        run: yarn jest --config jest.config.cjs --runInBand --runTestsByPath src/modules/premier_pos/lib/__tests__/native-catalog-setup.test.ts
      - name: Verify live native WMS stock operations contracts
        run: yarn jest --config jest.config.cjs --runInBand --runTestsByPath src/modules/premier_pos/lib/__tests__/stock-operations.test.ts
      - name: Validate read-only Sage/Open Mercato catalog projection and API scope
        run: yarn jest --config jest.config.cjs --runInBand --runTestsByPath src/lib/premieros/__tests__/sage-catalog-bridge.test.ts src/modules/premier_pos/api/__tests__/sage-catalog-preview.test.ts
      - name: Verify local-only Sage catalog comparison and safety boundaries
        run: yarn jest --config jest.config.cjs --runInBand --runTestsByPath src/lib/premieros/__tests__/sage-catalog-parity.test.ts
      - name: Test Sage's existing Excel-export CSV comparison safety
        run: yarn jest --config jest.config.cjs --runInBand --runTestsByPath src/lib/premieros/__tests__/sage-excel-parity.test.ts
      - name: Inventory app-owned screens
        run: node scripts/premieros-route-inventory.mjs > "$RUNNER_TEMP/premieros-routes.json"
      - name: Typecheck foundation source (isolated from generated registry)
        run: yarn tsc --project tsconfig.premieros-foundations.json --noEmit --pretty false
      - name: Typecheck order lifecycle screen without production credentials
        run: yarn tsc --project tsconfig.premier-pos-order-lifecycle.json --noEmit --pretty false
      - name: Typecheck native setup screen
        run: yarn tsc --project tsconfig.premier-pos-native-setup.json --noEmit --pretty false
