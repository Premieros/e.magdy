name: Verify Garments Prototype
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check src/analytics.mjs
      - run: node --check src/accounting.mjs
      - run: node --check src/accounting-ui.mjs
      - run: node --check src/access-control.mjs
      - run: node --check src/access-ui.mjs
      - run: node --check src/i18n.mjs
      - run: node --check src/notifications.mjs
      - run: node --check src/factory-ops.mjs
      - run: node --check src/cloud-backup.mjs
      - run: node --check src/cloud-sync.mjs
      - run: node --check src/production-planning.mjs
      - run: node --check src/wholesale.mjs
      - run: node --check src/demo-data.mjs
      - run: node --check src/cloud-intake.mjs
      - name: Test inventory, production and quality
        run: npm test
      - name: Check entrypoint and static assets
        run: |
          test -s index.html
          test -s styles.css
          test -s README.md
          grep -q 'src="./app.js"' index.html
